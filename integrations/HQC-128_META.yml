    src/ref/reed_solomon.c src/ref/reed_muller.c src/ref/hqc.c src/ref/vector.h
    src/ref/hqc-1/reed_solomon.h src/ref/hqc-1/parameters.h src/ref/hqc.h
    src/ref/parsing.h src/ref/data_structures.h src/ref/gf.h src/ref/gf2x.h
